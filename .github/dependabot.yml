version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
